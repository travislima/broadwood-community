<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; background: #ece7da; }
  .leaflet-tile-pane { filter: sepia(0.22) saturate(0.82) brightness(1.03) contrast(0.96); }
  .area-label { font: 700 11px/1.2 'Karla', 'Helvetica Neue', sans-serif; letter-spacing: 0.22em; color: #274634; text-shadow: 0 0 3px #fff, 0 1px 4px rgba(255,255,255,0.9); white-space: nowrap; text-align: center; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(255,253,248,0.8); }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map', { scrollWheelZoom: false, zoomControl: true, attributionControl: true })
    .setView([-33.9870, 25.5510], 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 18 }).addTo(map);
  // Patrol area per the association's map: Circular Dr / rail line in the
  // north-west, along Carrington Rd to William Moffett (M12) in the east,
  // Buffelsfontein Rd (M9) along the south, Melsetter/Bernard Rd in the west.
  var boundary = L.polygon([
    [-33.9794, 25.5334],  // NW: Circular Drive at the railway crossing
    [-33.9818, 25.5366],  // along the old railway alignment
    [-33.9847, 25.5403],  // bend where the railway line meets Margery Ave
    [-33.9847, 25.5459],  // north edge along Margery Ave / Francisco Rd
    [-33.9858, 25.5533],  // NE: on the M12 (17th Avenue / William Moffett)
    [-33.9915, 25.5527],  // M12 at the Buffelsfontein Rd junction
    [-33.9930, 25.5439],  // Buffelsfontein Rd at Genadendal Rd
    [-33.9945, 25.5353],  // SW: Buffelsfontein at Melsetter Rd
    [-33.9899, 25.5354]   // west: kink on Melsetter Rd, then up Bernard Rd
  ], { color: '#274634', weight: 2, opacity: 0.55, dashArray: '6 6', fillColor: '#3c6a4c', fillOpacity: 0.08 }).addTo(map);
  map.fitBounds(boundary.getBounds(), { padding: [10, 10] });
  function label(lat, lng, text) {
    L.marker([lat, lng], { icon: L.divIcon({ className: 'area-label', html: text, iconSize: [120, 14], iconAnchor: [60, 7] }), interactive: false }).addTo(map);
  }
  label(-33.9880, 25.5470, 'BROADWOOD');
</script>
</body>
</html>
